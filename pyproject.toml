[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow"
version = "0.1.0"
description = "Temporal workflow platform prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["temporalio==1.33.0"]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling==1.27.0",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "examples", "scripts", "tests", "docs", "README.md", "pyproject.toml", "uv.lock", "requirements.txt", "Makefile", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a local Temporal CLI (managed isolated server)",
    "contract: service boundary contract checks",
    "e2e: complete platform acceptance checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts/dev.py", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

