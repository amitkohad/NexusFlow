[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow"
version = "0.1.0"
description = "Temporal workflow platform prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.33.0",
    "pydantic>=2.10,<3",
    "packaging>=26,<27",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling==1.27.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "workflows",
    "libs/contracts/src/contracts",
    "libs/common/src/nexusflow_common",
    "libs/workflow-sdk/src/workflow_sdk",
    "apps/workflow-api/src/workflow_api",
    "apps/workflow-runtime/src/workflow_runtime",
    "workers/validation-worker/src/validation_worker",
    "workers/notification-worker/src/notification_worker",
    "workers/integration-worker/src/integration_worker",
    "workers/human-task-worker/src/human_task_worker",
    "workers/sample-business-worker/src/sample_business_worker",
    "libs/activities/src/nexusflow_activities",
    "apps/workflow-executor/src/workflow_executor",
    "workflow-packages/customer-adjustment/src/customer_adjustment_package",
    "tests/fixtures/workflow-packages/validation-reference/src/validation_reference_package",
]

[tool.hatch.build.targets.sdist]
include = ["app", "apps", "workers", "libs", "workflows", "workflow-packages", "migrations", "examples", "scripts", "tests", "docs", "README.md", "pyproject.toml", "uv.lock", "requirements.txt", "Makefile", ".env.example"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "workflow_api/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a local Temporal CLI (managed isolated server)",
    "contract: service boundary contract checks",
    "e2e: complete platform acceptance checks",
    "postgres: requires NEXUSFLOW_TEST_DATABASE_URL for an isolated test database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["app", "apps", "workers", "libs", "workflows", "workflow-packages", "scripts/dev.py", "scripts/build_services.py", "scripts/build_workflow_packages.py", "scripts/verify_installed_workflow_package.py", "scripts/generate_definition_schema.py", "scripts/generate_package_schema.py", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
