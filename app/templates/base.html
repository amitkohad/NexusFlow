<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusFlow</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#172554;color:white;padding:1rem 5%;display:flex;justify-content:space-between}main{max-width:1000px;margin:2rem auto;padding:0 1rem}.card{background:white;padding:1.25rem;margin:1rem 0;border-radius:10px;box-shadow:0 2px 10px #dbe3ef}label{display:block;margin:.7rem 0}input,textarea{width:100%;box-sizing:border-box;padding:.65rem}button,.button{background:#2563eb;color:white;border:0;border-radius:6px;padding:.7rem 1rem;text-decoration:none;cursor:pointer}.reject{background:#b91c1c}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #ddd}.muted{color:#64748b}.actions{display:flex;gap:.6rem}code{overflow-wrap:anywhere}
</style></head><body><header><strong>NexusFlow</strong>{% if user %}<span>{{ user.name }} · <a style="color:white" href="/logout">Sign out</a></span>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
