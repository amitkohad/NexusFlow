{% extends "base.html" %}{% block content %}<h1>Approval requests</h1><div class="card"><table><tr><th>Customer</th><th>Amount</th><th>Requested by</th><th></th></tr>{% for item in executions %}<tr><td>{{ item.request.customer_id }}</td><td>{{ item.request.amount }}</td><td>{{ item.requested_by }}</td><td><a class="button" href="/manager/{{ item.workflow_id }}">Review</a></td></tr>{% else %}<tr><td colspan="4" class="muted">No requests await approval.</td></tr>{% endfor %}</table></div>{% endblock %}
