{% extends "base.html" %}{% block content %}<h1>Customer adjustment</h1><div class="card"><form method="post" action="/requests"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Customer ID<input name="customer_id" value="C-100045" required></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" value="7500" required></label><label>Reason<textarea name="reason" required>fee correction</textarea></label><label><input style="width:auto" name="simulate_transient_failure" type="checkbox" value="true" checked> Simulate transient failure</label><button>Submit workflow</button></form></div><h2>My executions</h2><div class="card"><table><tr><th>Process</th><th>Customer</th><th>Amount</th><th>Status</th></tr>{% for item in executions %}<tr><td><code>{{ item.workflow_id }}</code></td><td>{{ item.request.customer_id }}</td><td>{{ item.request.amount }}</td><td>{{ item.state }}</td></tr>{% else %}<tr><td colspan="4" class="muted">No executions yet.</td></tr>{% endfor %}</table></div>{% endblock %}
