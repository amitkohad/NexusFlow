[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow-workflow-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["nexusflow-contracts==0.1.0", "nexusflow-common==0.1.0", "nexusflow-workflows==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_sdk"]
