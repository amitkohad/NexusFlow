[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow-activities"
version = "0.2.0"
description = "Named reference Activities embedded in NexusFlow workflow packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nexusflow-contracts==0.1.0", "temporalio==1.33.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nexusflow_activities"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
