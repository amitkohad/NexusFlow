[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow-human-task-service"
version = "0.1.0"
description = "Shared durable human-task service for NexusFlow workflows"
requires-python = ">=3.11"
dependencies = [
    "nexusflow-contracts==0.1.0",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "temporalio==1.33.0",
    "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/human_task_service"]
