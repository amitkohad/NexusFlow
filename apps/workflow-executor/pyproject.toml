[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusflow-workflow-executor"
version = "0.1.0"
description = "Generic trusted workflow-package executor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nexusflow-contracts==0.1.0", "nexusflow-common==0.1.0",
    "nexusflow-workflow-sdk==0.1.0", "nexusflow-workflows==0.1.0",
    "temporalio==1.33.0",
]

[project.scripts]
nexusflow-workflow-executor = "workflow_executor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_executor"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml", ".env.example"]
